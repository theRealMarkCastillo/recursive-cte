services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-graph_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-graph_password}
      POSTGRES_DB: ${POSTGRES_DB:-graphdb}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55450}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
